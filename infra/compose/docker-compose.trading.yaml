services:
  spot_grid_bot:
    profiles: ["trading"]
    build:
      context: ../../spot_grid_bot
      dockerfile: Dockerfile
    image: platform_spot_grid_bot
    restart: always
    networks:
      - platform
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../spot_grid_bot/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE: ${DB_NAME}
      HEALTHCHECK_HOST: 0.0.0.0
      HEALTHCHECK_PORT: 8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  platform:
    name: platform_network
