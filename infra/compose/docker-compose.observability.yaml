services:
  loki:
    profiles: ["observability"]
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - platform_loki_data:/loki
    restart: always
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.6.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - platform_alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    networks:
      - platform

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    depends_on:
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - platform_grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: always
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  platform_loki_data:
    name: platform_loki_data
  platform_alloy_data:
    name: platform_alloy_data
  platform_grafana_data:
    name: platform_grafana_data

networks:
  platform:
    name: platform_network
