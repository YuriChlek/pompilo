services:
  market_data_migrate:
    profiles: ["platform"]
    build:
      context: ../../market-data-service
      dockerfile: Dockerfile
    image: platform_market_data_service
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin_pass}
      DB_NAME: ${DB_NAME:-pampilo_db}
      DATABASE: ${DB_NAME:-pampilo_db}
    command: ["alembic", "upgrade", "head"]
    networks:
      - platform

  market_data:
    profiles: ["platform"]
    build:
      context: ../../market-data-service
      dockerfile: Dockerfile
    image: platform_market_data_service
    restart: unless-stopped
    depends_on:
      market_data_migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin_pass}
      DB_NAME: ${DB_NAME:-pampilo_db}
      DATABASE: ${DB_NAME:-pampilo_db}
      MARKET_DATA_REDIS_URL: redis://redis:6379/0
      MARKET_DATA_PROVIDER_MODE: ${MARKET_DATA_PROVIDER_MODE:-binance}
      MARKET_DATA_PROVIDER_SYMBOLS: ${MARKET_DATA_PROVIDER_SYMBOLS:-ETHUSDT}
      MARKET_DATA_TIMEFRAMES: ${MARKET_DATA_TIMEFRAMES:-1h,4h,1d}
      MARKET_DATA_HTTP_HOST: 0.0.0.0
      MARKET_DATA_HTTP_PORT: 8010
      MARKET_DATA_SCHEDULER_ENABLED: ${MARKET_DATA_SCHEDULER_ENABLED:-true}
      MARKET_DATA_OUTBOX_PUBLISHER_ENABLED: ${MARKET_DATA_OUTBOX_PUBLISHER_ENABLED:-true}
    command: ["python", "-m", "market_data_service.main", "serve"]
    healthcheck:
      test: ["CMD", "python", "-m", "market_data_service.main", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - platform

  market_data_symbols_sync:
    profiles: ["platform"]
    build:
      context: ../../market-data-service
      dockerfile: Dockerfile
    image: platform_market_data_service
    restart: "no"
    depends_on:
      market_data_migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin_pass}
      DB_NAME: ${DB_NAME:-pampilo_db}
      DATABASE: ${DB_NAME:-pampilo_db}
      MARKET_DATA_REDIS_URL: redis://redis:6379/0
      MARKET_DATA_PROVIDER_MODE: ${MARKET_DATA_PROVIDER_MODE:-binance}
      MARKET_DATA_PROVIDER_SYMBOLS: ${MARKET_DATA_PROVIDER_SYMBOLS:-ETHUSDT}
      MARKET_DATA_TIMEFRAMES: ${MARKET_DATA_TIMEFRAMES:-1h,4h,1d}
    command: ["python", "-m", "market_data_service.main", "symbols:sync"]
    networks:
      - platform

  market_data_backfill:
    profiles: ["platform"]
    build:
      context: ../../market-data-service
      dockerfile: Dockerfile
    image: platform_market_data_service
    restart: "no"
    depends_on:
      market_data_migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin_pass}
      DB_NAME: ${DB_NAME:-pampilo_db}
      DATABASE: ${DB_NAME:-pampilo_db}
      MARKET_DATA_REDIS_URL: redis://redis:6379/0
      MARKET_DATA_PROVIDER_MODE: ${MARKET_DATA_PROVIDER_MODE:-binance}
      MARKET_DATA_PROVIDER_SYMBOLS: ${MARKET_DATA_PROVIDER_SYMBOLS:-ETHUSDT}
      MARKET_DATA_TIMEFRAMES: ${MARKET_DATA_TIMEFRAMES:-1h,4h,1d}
      MARKET_DATA_BACKFILL_BATCH_CANDLES: ${MARKET_DATA_BACKFILL_BATCH_CANDLES:-500}
      MARKET_DATA_BACKFILL_MAX_CONCURRENCY: ${MARKET_DATA_BACKFILL_MAX_CONCURRENCY:-1}
    command:
      [
        "python",
        "-m",
        "market_data_service.main",
        "backfill",
        "--symbol",
        "${MARKET_DATA_BACKFILL_SYMBOL:-}",
        "--timeframe",
        "${MARKET_DATA_BACKFILL_TIMEFRAME:-}",
        "--from",
        "${MARKET_DATA_BACKFILL_FROM:-}",
        "--to",
        "${MARKET_DATA_BACKFILL_TO:-}",
      ]
    networks:
      - platform

  bot_platform_migrate:
    profiles: ["platform"]
    build:
      context: ../../bot-platform-service
      dockerfile: Dockerfile
    image: platform_bot_platform_service
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      market_data_migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin_pass}
      DB_NAME: ${DB_NAME:-pampilo_db}
      DATABASE: ${DB_NAME:-pampilo_db}
    command: ["alembic", "upgrade", "head"]
    networks:
      - platform

  bot_platform:
    profiles: ["platform"]
    build:
      context: ../../bot-platform-service
      dockerfile: Dockerfile
    image: platform_bot_platform_service
    restart: unless-stopped
    depends_on:
      bot_platform_migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin_pass}
      DB_NAME: ${DB_NAME:-pampilo_db}
      DATABASE: ${DB_NAME:-pampilo_db}
      BOT_PLATFORM_HTTP_HOST: 0.0.0.0
      BOT_PLATFORM_HTTP_PORT: 8092
      BOT_PLATFORM_MARKET_DATA_BASE_URL: ${BOT_PLATFORM_MARKET_DATA_BASE_URL:-http://market_data:8010}
      BOT_PLATFORM_MARKET_DATA_SOURCE: ${BOT_PLATFORM_MARKET_DATA_SOURCE:-BINANCE_SPOT}
      BOT_PLATFORM_SIGNAL_EVENTS_ENABLED: ${BOT_PLATFORM_SIGNAL_EVENTS_ENABLED:-false}
      BOT_PLATFORM_SIGNAL_EVENTS_REDIS_URL: ${BOT_PLATFORM_SIGNAL_EVENTS_REDIS_URL:-redis://redis:6379/0}
      BOT_PLATFORM_SIGNAL_EVENTS_STREAM: ${BOT_PLATFORM_SIGNAL_EVENTS_STREAM:-bot-platform-signals}
    command: ["python", "-m", "bot_platform_service.main", "serve"]
    healthcheck:
      test: ["CMD", "python", "-m", "bot_platform_service.main", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - platform

  bot_platform_runner:
    profiles: ["platform"]
    build:
      context: ../../bot-platform-service
      dockerfile: Dockerfile
    image: platform_bot_platform_service
    restart: unless-stopped
    depends_on:
      bot_platform_migrate:
        condition: service_completed_successfully
      bot_platform:
        condition: service_healthy
      market_data:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin_pass}
      DB_NAME: ${DB_NAME:-pampilo_db}
      DATABASE: ${DB_NAME:-pampilo_db}
      BOT_PLATFORM_MARKET_DATA_BASE_URL: ${BOT_PLATFORM_MARKET_DATA_BASE_URL:-http://market_data:8010}
      BOT_PLATFORM_MARKET_DATA_SOURCE: ${BOT_PLATFORM_MARKET_DATA_SOURCE:-BINANCE_SPOT}
      BOT_PLATFORM_RUNNER_POLL_INTERVAL_SECONDS: ${BOT_PLATFORM_RUNNER_POLL_INTERVAL_SECONDS:-15}
      BOT_PLATFORM_SIGNAL_EVENTS_ENABLED: ${BOT_PLATFORM_SIGNAL_EVENTS_ENABLED:-false}
      BOT_PLATFORM_SIGNAL_EVENTS_REDIS_URL: ${BOT_PLATFORM_SIGNAL_EVENTS_REDIS_URL:-redis://redis:6379/0}
      BOT_PLATFORM_SIGNAL_EVENTS_STREAM: ${BOT_PLATFORM_SIGNAL_EVENTS_STREAM:-bot-platform-signals}
    command: ["python", "-m", "bot_platform_service.main", "runner"]
    networks:
      - platform

  bot_modules_sync:
    profiles: ["platform"]
    build:
      context: ../../bot-platform-service
      dockerfile: Dockerfile
    image: platform_bot_platform_service
    restart: "no"
    depends_on:
      bot_platform_migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin_pass}
      DB_NAME: ${DB_NAME:-pampilo_db}
      DATABASE: ${DB_NAME:-pampilo_db}
    command: ["python", "-m", "bot_platform_service.main", "bot:modules:sync"]
    networks:
      - platform

networks:
  platform:
    name: platform_network
